# WRTC 2030 Croatia (wrtc2030.hr) — Netlify Configuration (AD-8 / FR-14)
# Builds and deploys the Next.js 15 App Router platform with @netlify/plugin-nextjs.

[build]
  command = "npm run validate:data && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
